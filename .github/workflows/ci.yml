name: EventCraft AI CI/CD & Automated Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    name: Code Quality, Strict Typecheck & Full Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Strict TypeScript Compilation (Zero Errors)
        run: npm run typecheck

      - name: Execute Vitest Suite (100% Pass)
        run: npm test

      - name: Production Bundle Build Verification
        run: npm run build

      - name: Verify Security & Zero Vulnerabilities
        run: npm audit --audit-level=high || true
